version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ai_km_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_task_km
      MYSQL_USER: km_user
      MYSQL_PASSWORD: km_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ai_km_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: km_user
      DB_PASSWORD: km_password
      DB_NAME: ai_task_km
      JWT_SECRET_KEY: super-secret-jwt-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 120
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      UPLOAD_DIR: storage/uploads
      VECTOR_INDEX_DIR: storage/vector_index
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@example.com
      DEFAULT_ADMIN_PASSWORD: Admin@123
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: ai_km_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  backend_storage:
